<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1120" viewBox="0 0 1280 1120">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 30px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #475569; }
      .lane-title { font: 700 14px Arial, sans-serif; fill: #334155; letter-spacing: .5px; }
      .lane { fill: #eef2f7; stroke: #cbd5e1; stroke-width: 1; }
      .box { fill: #ffffff; stroke: #64748b; stroke-width: 2; rx: 8; }
      .start { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; rx: 28; }
      .end { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; rx: 28; }
      .decision { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
      .exception { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; rx: 8; }
      .note { fill: #fef9c3; stroke: #ca8a04; stroke-width: 1.5; rx: 8; }
      .txt { font: 600 16px Arial, sans-serif; fill: #0f172a; }
      .small { font: 400 13px Arial, sans-serif; fill: #334155; }
      .line { stroke: #334155; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .soft-line { stroke: #64748b; stroke-width: 2; stroke-dasharray: 6 5; fill: none; marker-end: url(#arrow); }
      .label { font: 700 12px Arial, sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="1120"/>
  <text x="640" y="48" text-anchor="middle" class="title">Flujograma del proceso principal hasta ENTREGADO</text>
  <text x="640" y="74" text-anchor="middle" class="subtitle">Bolipost: solicitudes, paquetes EMS/Contrato/Certificado/Ordinario, despacho, distribucion y entrega</text>

  <rect x="70" y="110" width="260" height="900" class="lane"/>
  <rect x="360" y="110" width="260" height="900" class="lane"/>
  <rect x="650" y="110" width="260" height="900" class="lane"/>
  <rect x="940" y="110" width="260" height="900" class="lane"/>
  <text x="200" y="138" text-anchor="middle" class="lane-title">CLIENTE / ADMISION</text>
  <text x="490" y="138" text-anchor="middle" class="lane-title">ALMACEN / VENTANILLA</text>
  <text x="780" y="138" text-anchor="middle" class="lane-title">DESPACHO / TRANSITO</text>
  <text x="1070" y="138" text-anchor="middle" class="lane-title">CARTERO / ENTREGA</text>

  <rect x="100" y="175" width="200" height="62" class="start"/>
  <text x="200" y="200" text-anchor="middle" class="txt">Inicio</text>
  <text x="200" y="220" text-anchor="middle" class="small">Cliente solicita o registra envio</text>

  <rect x="100" y="275" width="200" height="76" class="box"/>
  <text x="200" y="304" text-anchor="middle" class="txt">Registro de envio</text>
  <text x="200" y="325" text-anchor="middle" class="small">Preregistro, solicitud, EMS,</text>
  <text x="200" y="343" text-anchor="middle" class="small">contrato, certi u ordi</text>

  <rect x="100" y="390" width="200" height="78" class="box"/>
  <text x="200" y="419" text-anchor="middle" class="txt">Admision</text>
  <text x="200" y="440" text-anchor="middle" class="small">Se genera codigo/barcode</text>
  <text x="200" y="458" text-anchor="middle" class="small">y evento de recepcion</text>

  <rect x="390" y="390" width="200" height="78" class="box"/>
  <text x="490" y="419" text-anchor="middle" class="txt">ALMACEN</text>
  <text x="490" y="440" text-anchor="middle" class="small">Validacion, peso, precio</text>
  <text x="490" y="458" text-anchor="middle" class="small">y control operativo</text>

  <polygon points="490,515 600,575 490,635 380,575" class="decision"/>
  <text x="490" y="570" text-anchor="middle" class="txt">Destino local?</text>
  <text x="490" y="590" text-anchor="middle" class="small">mismo departamento</text>

  <rect x="390" y="700" width="200" height="78" class="box"/>
  <text x="490" y="729" text-anchor="middle" class="txt">VENTANILLA</text>
  <text x="490" y="750" text-anchor="middle" class="small">Si el servicio es</text>
  <text x="490" y="768" text-anchor="middle" class="small">puerta a ventanilla</text>

  <rect x="680" y="390" width="200" height="78" class="box"/>
  <text x="780" y="419" text-anchor="middle" class="txt">Despacho / saca</text>
  <text x="780" y="440" text-anchor="middle" class="small">APERTURA, ASIGNADO,</text>
  <text x="780" y="458" text-anchor="middle" class="small">CLAUSURA</text>

  <rect x="680" y="515" width="200" height="78" class="box"/>
  <text x="780" y="544" text-anchor="middle" class="txt">Expedicion</text>
  <text x="780" y="565" text-anchor="middle" class="small">Envio a ubicacion</text>
  <text x="780" y="583" text-anchor="middle" class="small">nacional / transito</text>

  <rect x="680" y="640" width="200" height="78" class="box"/>
  <text x="780" y="669" text-anchor="middle" class="txt">Recepcion destino</text>
  <text x="780" y="690" text-anchor="middle" class="small">Estado RECIBIDO o</text>
  <text x="780" y="708" text-anchor="middle" class="small">ALMACEN de destino</text>

  <rect x="970" y="640" width="200" height="78" class="box"/>
  <text x="1070" y="669" text-anchor="middle" class="txt">Distribucion</text>
  <text x="1070" y="690" text-anchor="middle" class="small">Asignacion a cartero</text>
  <text x="1070" y="708" text-anchor="middle" class="small">estado CARTERO</text>

  <rect x="970" y="770" width="200" height="78" class="box"/>
  <text x="1070" y="799" text-anchor="middle" class="txt">Salida a domicilio</text>
  <text x="1070" y="820" text-anchor="middle" class="small">Evento: en camino</text>
  <text x="1070" y="838" text-anchor="middle" class="small">para entrega fisica</text>

  <polygon points="1070,895 1180,955 1070,1015 960,955" class="decision"/>
  <text x="1070" y="950" text-anchor="middle" class="txt">Entrega exitosa?</text>
  <text x="1070" y="970" text-anchor="middle" class="small">firma / foto / guia</text>

  <rect x="970" y="1040" width="200" height="58" class="end"/>
  <text x="1070" y="1064" text-anchor="middle" class="txt">ENTREGADO</text>
  <text x="1070" y="1083" text-anchor="middle" class="small">Evento 316 registrado</text>

  <rect x="680" y="908" width="200" height="78" class="exception"/>
  <text x="780" y="936" text-anchor="middle" class="txt">Excepcion</text>
  <text x="780" y="957" text-anchor="middle" class="small">Intento fallido, devolucion,</text>
  <text x="780" y="975" text-anchor="middle" class="small">ventanilla o almacen</text>

  <rect x="96" y="820" width="230" height="92" class="note"/>
  <text x="211" y="848" text-anchor="middle" class="txt">Tracking</text>
  <text x="211" y="870" text-anchor="middle" class="small">Cada movimiento inserta evento</text>
  <text x="211" y="888" text-anchor="middle" class="small">en eventos_ems, eventos_certi,</text>
  <text x="211" y="906" text-anchor="middle" class="small">eventos_ordi, contrato o tiktoker</text>

  <path d="M200 237 V275" class="line"/>
  <path d="M200 351 V390" class="line"/>
  <path d="M300 429 H390" class="line"/>
  <path d="M490 468 V515" class="line"/>
  <path d="M600 575 H780 V390" class="line"/>
  <text x="638" y="564" class="label">No</text>
  <path d="M490 635 V700" class="line"/>
  <text x="500" y="668" class="label">Si / ventanilla</text>
  <path d="M590 739 H1070 V1040" class="line"/>
  <text x="778" y="730" class="label">retiro en ventanilla</text>
  <path d="M780 468 V515" class="line"/>
  <path d="M780 593 V640" class="line"/>
  <path d="M880 679 H970" class="line"/>
  <path d="M1070 718 V770" class="line"/>
  <path d="M1070 848 V895" class="line"/>
  <path d="M1070 1015 V1040" class="line"/>
  <text x="1082" y="1030" class="label">Si</text>
  <path d="M960 955 H880" class="line"/>
  <text x="914" y="944" class="label">No</text>
  <path d="M780 908 V718" class="soft-line"/>
  <text x="790" y="815" class="label">reintento / retorno operativo</text>
  <path d="M326 866 H680" class="soft-line"/>
</svg>
